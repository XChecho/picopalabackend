# Compose de producción: usa imágenes ya construidas por GitHub Actions (GHCR) en lugar de compilar en el VPS.
# El workflow deploy.yml lo copia a /opt/picopala y exporta IMAGE_API, IMAGE_MIGRATE e IMAGE_TAG.
# Mismo `name` que docker-compose.yml para conservar el volumen redis-data y reemplazar los contenedores existentes.
name: picopala

services:
  migrate:
    image: ${IMAGE_MIGRATE:?IMAGE_MIGRATE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    command: npx prisma migrate deploy
    env_file: .env
    restart: "no"

  api:
    image: ${IMAGE_API:?IMAGE_API is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file: .env
    environment:
      PORT: 4001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      # Solo loopback del VPS: el Nginx del host publica el dominio.
      - "127.0.0.1:${API_HOST_PORT:-4002}:4001"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
