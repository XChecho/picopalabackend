name: Deploy

# Se ejecuta cuando CI termina en verde sobre main. También manual para redeploy o rollback:
# pasar `image_tag` con un SHA ya publicado en GHCR para desplegarlo sin reconstruir.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag (SHA) ya publicado en GHCR. Vacío = construir HEAD de main."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /opt/picopala

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.image_tag == '' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image_api: ${{ steps.vars.outputs.image_api }}
      image_migrate: ${{ steps.vars.outputs.image_migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: vars
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_api=${repo}" >> "$GITHUB_OUTPUT"
          echo "image_migrate=${repo}-migrate" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etapa `runtime`: imagen de la API.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.vars.outputs.image_api }}:${{ steps.vars.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Etapa `build`: incluye la CLI de Prisma (devDependency) para `migrate deploy`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: true
          tags: ${{ steps.vars.outputs.image_migrate }}:${{ steps.vars.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    needs: build
    # `build` se omite en un rollback manual (image_tag informado); en ese caso se despliega ese tag.
    if: >-
      always() &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: vars
        env:
          BUILD_TAG: ${{ needs.build.outputs.tag }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=${INPUT_TAG:-$BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_api=${repo}" >> "$GITHUB_OUTPUT"
          echo "image_migrate=${repo}-migrate" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml deploy/remote-deploy.sh "$USER_NAME@$HOST:$APP_DIR/"

      # El GITHUB_TOKEN del run viaja por stdin y solo vive durante este login: no hay PAT guardado en el VPS.
      - name: Pull and restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_API: ${{ steps.vars.outputs.image_api }}
          IMAGE_MIGRATE: ${{ steps.vars.outputs.image_migrate }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST" \
            "APP_DIR='$APP_DIR' REGISTRY_USER='$REGISTRY_USER' IMAGE_API='$IMAGE_API' IMAGE_MIGRATE='$IMAGE_MIGRATE' IMAGE_TAG='$IMAGE_TAG' bash '$APP_DIR/remote-deploy.sh'"

      - name: Health check
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4002/api/v1/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose -f /opt/picopala/docker-compose.prod.yml logs --tail 80 api >&2
          exit 1
          REMOTE

      # Solo imágenes sin uso de este repo con más de 7 días; no toca imágenes de otros servicios del VPS.
      - name: Prune old images
        if: success()
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          SOURCE_LABEL: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" \
            "docker image prune -af --filter 'label=$SOURCE_LABEL' --filter 'until=168h'"

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key
