name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

      # Levanta Postgres/Redis desechables con docker-compose.test.yml (Docker viene en el runner).
      - name: E2E tests
        run: npm run test:e2e -- --ci

      - name: Tear down E2E infrastructure
        if: always()
        run: npm run test:e2e:down
