name: Deploy (new server)

# Despliega la API en el servidor nuevo (compose unificado de picopala-infra).
# Por ahora solo manual, para no competir con `deploy.yml` (VPS actual). Al hacer el cutover:
#   1) añadir el trigger `workflow_run` (como en deploy.yml) a este workflow,
#   2) eliminar deploy.yml, docker-compose.prod.yml y deploy/remote-deploy.sh.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag (SHA) ya publicado en GHCR. Vacío = construir HEAD de main."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-new-server
  cancel-in-progress: false

env:
  APP_DIR: /opt/picopala

jobs:
  build:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_api=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_migrate=ghcr.io/${GITHUB_REPOSITORY,,}-migrate" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etapa `runtime`: imagen de la API.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.vars.outputs.image_api }}:${{ steps.vars.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Etapa `build`: incluye la CLI de Prisma para `migrate deploy`. Sufijo `-migrate`, igual que el compose.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: true
          tags: ${{ steps.vars.outputs.image_migrate }}:${{ steps.vars.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || inputs.image_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # migrate corre antes de api (depends_on) y el script espera al health check; si falla, vuelve al tag anterior.
      - name: Pull, migrate and restart api
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST" \
            "APP_DIR='$APP_DIR' REGISTRY_USER='$REGISTRY_USER' IMAGE_TAG='$IMAGE_TAG' bash '$APP_DIR/scripts/deploy-service.sh' api"

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key
