# Nginx (contenedor) -> API de Pico & Pala.
# Requisitos:
#   - La API y Nginx comparten la red Docker definida en docker-compose.prod.yml.
#   - Cloudflare con proxy activo (nube naranja) y SSL/TLS en "Full (strict)".
#   - Certificado de origen de Cloudflare montado en /etc/nginx/certs/.
# Sustituir api.example.com por el subdominio real.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/picopala-origin.pem;
    ssl_certificate_key /etc/nginx/certs/picopala-origin.key;

    client_max_body_size 10m;

    # IP real del cliente detrás de Cloudflare (lista completa: https://www.cloudflare.com/ips/)
    real_ip_header CF-Connecting-IP;

    location /socket.io/ {
        proxy_pass http://picopala-api:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://picopala-api:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
