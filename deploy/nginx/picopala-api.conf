# Nginx del HOST (no contenedor) -> API de Pico & Pala publicada en 127.0.0.1:4002.
# Instalación (en el VPS):
#   /etc/nginx/sites-available/picopalaapi  (este archivo)
#   ln -s /etc/nginx/sites-available/picopalaapi /etc/nginx/sites-enabled/picopalaapi
#   nginx -t && systemctl reload nginx
# Requisitos:
#   - DNS picopalaapi.xchecho.com con proxy de Cloudflare activo (nube naranja), SSL/TLS "Full (strict)".
#   - Certificado de origen de Cloudflare comodin (*.xchecho.com, valido hasta 2041) ya instalado en
#     /etc/nginx/ssl/vantioapi.xchecho.com.{pem,key}; se reutiliza, no hace falta crear otro.
#   - Rangos de Cloudflare: https://www.cloudflare.com/ips (revisar de vez en cuando).

map $http_upgrade $picopala_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name picopalaapi.xchecho.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name picopalaapi.xchecho.com;

    # Certificado comodin compartido con vantio. Si algun dia se cambia, actualizar ambos sitios.
    ssl_certificate     /etc/nginx/ssl/vantioapi.xchecho.com.pem;
    ssl_certificate_key /etc/nginx/ssl/vantioapi.xchecho.com.key;

    client_max_body_size 10m;

    # IP real del cliente: solo se confía en CF-Connecting-IP si la conexión viene de Cloudflare.
    # Acotado a este server para no alterar los demás sitios del VPS.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $picopala_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se fija (no se concatena) para que un cliente no pueda inyectar IPs falsas.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
